name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Deploy da Calculadora (app.tooloptimizercnc.com.br)
  # Servido via Cloudflare Worker Static Assets (wrangler.jsonc)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-app:
    name: "Deploy Calculadora → app.tooloptimizercnc.com.br"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality Gate (TypeCheck + Tests)
        run: npm run check

      - name: Build web assets
        run: npm run build
        env:
          VITE_BASE_URL: /

      - name: Deploy to Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4.68.0"
          command: deploy

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy da Landing Page / Site de Vendas
  # Destino: www.tooloptimizercnc.com.br (Cloudflare Pages)
  # tooloptimizercnc.com.br redireciona para www via regra no painel Cloudflare
  #
  # PRÉ-REQUISITOS para este job funcionar:
  #   1. Criar o projeto Pages "tooloptimizer-landing" em dash.cloudflare.com
  #   2. Vincular o domínio www.tooloptimizercnc.com.br ao projeto Pages
  #   3. Configurar redirect 301 do naked domain (tooloptimizercnc.com.br → www)
  #      via Cloudflare Rules > Redirect Rules no painel (não no _redirects)
  #   4. CF_API_TOKEN deve ter permissão "Cloudflare Pages: Edit"
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-landing:
    name: "Deploy Landing → www.tooloptimizercnc.com.br"
    runs-on: ubuntu-latest
    continue-on-error: true   # Não bloqueia o deploy da calculadora se o Pages falhar
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Deploy landing to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4.68.0"
          command: pages deploy landing --project-name=tooloptimizer-landing --commit-dirty=true
