<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141C"/>
      <stop offset="100%" stop-color="#080A0E"/>
    </linearGradient>
    <linearGradient id="grad-sector1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16202C"/>
      <stop offset="100%" stop-color="#1E2C3D"/>
    </linearGradient>
    <linearGradient id="grad-sector2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7C69"/>
      <stop offset="60%" stop-color="#13A88D"/>
      <stop offset="100%" stop-color="#19E4BB"/>
    </linearGradient>
    <linearGradient id="grad-sector3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19E4BB"/>
      <stop offset="100%" stop-color="#13B896"/>
    </linearGradient>
    <linearGradient id="grad-arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7BC71E"/>
      <stop offset="40%" stop-color="#A3F527"/>
      <stop offset="100%" stop-color="#BDFF4B"/>
    </linearGradient>
    <filter id="glow-arrow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#BDFF4B" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Fundo Dark Titânio -->
  <rect width="500" height="500" rx="100" fill="url(#grad-bg)"/>
  
  <!-- Setores do Gauge de Produtividade -->
  <path d="M 70.00 340.00 A 180 180 0 0 1 116.23 219.56 L 179.40 276.43 A 95 95 0 0 0 155.00 340.00 Z" fill="url(#grad-sector1)" stroke="rgba(25, 228, 187, 0.2)" stroke-width="1.5"/>
  <path d="M 124.96 210.52 A 180 180 0 0 1 370.44 206.23 L 313.57 269.40 A 95 95 0 0 0 184.01 271.66 Z" fill="url(#grad-sector2)" stroke="rgba(25, 228, 187, 0.4)" stroke-width="1.5"/>
  <path d="M 379.48 214.96 A 180 180 0 0 1 430.00 340.00 L 345.00 340.00 A 95 95 0 0 0 318.34 274.01 Z" fill="url(#grad-sector3)" stroke="#19E4BB" stroke-width="1.5"/>
  
  <!-- Seta / Raio de Produtividade Ascendente -->
  <path d="M 115 450 L 210 270 L 248 305 L 345 170 L 330 155 L 410 95 L 385 195 L 368 188 L 262 335 L 222 298 L 115 450 Z" fill="url(#grad-arrow)" filter="url(#glow-arrow)" stroke="#E4FF94" stroke-width="1.2"/>
</svg>