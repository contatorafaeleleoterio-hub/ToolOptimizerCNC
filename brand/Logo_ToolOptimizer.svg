<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-sector1-lg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16202C"/>
      <stop offset="100%" stop-color="#1E2C3D"/>
    </linearGradient>
    <linearGradient id="grad-sector2-lg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7C69"/>
      <stop offset="60%" stop-color="#13A88D"/>
      <stop offset="100%" stop-color="#19E4BB"/>
    </linearGradient>
    <linearGradient id="grad-sector3-lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19E4BB"/>
      <stop offset="100%" stop-color="#13B896"/>
    </linearGradient>
    <linearGradient id="grad-arrow-lg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7BC71E"/>
      <stop offset="40%" stop-color="#A3F527"/>
      <stop offset="100%" stop-color="#BDFF4B"/>
    </linearGradient>
    <linearGradient id="grad-frame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#19E4BB" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#64F0A4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#BDFF4B" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow-arrow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#BDFF4B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&amp;display=swap');
    .txt-tool {
      font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 75px;
      fill: var(--tx-1, #FFFFFF);
      letter-spacing: -0.02em;
    }
    .txt-opt {
      font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 75px;
      fill: var(--brand-fill, #19E4BB);
      letter-spacing: -0.02em;
    }
    .txt-cnc {
      font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 75px;
      fill: var(--brand-cnc, var(--tx-1, #FFFFFF));
      letter-spacing: -0.02em;
    }
    .txt-sub {
      font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 18px;
      fill: var(--tx-3, #8E9FB8);
      letter-spacing: 0.26em;
      text-transform: uppercase;
    }
  </style>

  <!-- Moldura técnica externa com cantos arredondados contornando o texto -->
  <path d="M 230 115 L 910 115 A 45 45 0 0 1 955 160 L 955 165 A 45 45 0 0 1 910 210 L 195 210" 
        fill="none" 
        stroke="url(#grad-frame)" 
        stroke-width="3" 
        stroke-linecap="round"/>

  <!-- Símbolo do Gauge posicionado à esquerda (escala 0.52, translação x=15, y=10) -->
  <g transform="translate(15, 10) scale(0.52)">
    <!-- Setores do Gauge -->
    <path d="M 70.00 340.00 A 180 180 0 0 1 116.23 219.56 L 179.40 276.43 A 95 95 0 0 0 155.00 340.00 Z" fill="url(#grad-sector1-lg)" stroke="rgba(25, 228, 187, 0.25)" stroke-width="2"/>
    <path d="M 124.96 210.52 A 180 180 0 0 1 370.44 206.23 L 313.57 269.40 A 95 95 0 0 0 184.01 271.66 Z" fill="url(#grad-sector2-lg)" stroke="rgba(25, 228, 187, 0.45)" stroke-width="2"/>
    <path d="M 379.48 214.96 A 180 180 0 0 1 430.00 340.00 L 345.00 340.00 A 95 95 0 0 0 318.34 274.01 Z" fill="url(#grad-sector3-lg)" stroke="#19E4BB" stroke-width="2"/>
    
    <!-- Seta / Raio Ascendente -->
    <path d="M 115 450 L 210 270 L 248 305 L 345 170 L 330 155 L 410 95 L 385 195 L 368 188 L 262 335 L 222 298 L 115 450 Z" fill="url(#grad-arrow-lg)" filter="url(#glow-arrow-lg)" stroke="#E4FF94" stroke-width="1.5"/>
  </g>

  <!-- Tipografia Refatorada em Urbanist com Sigla CNC Canônica -->
  <text x="260" y="178">
    <tspan class="txt-tool">Tool</tspan>
    <tspan class="txt-opt">Optimizer</tspan>
    <tspan class="txt-cnc" dx="10">CNC</tspan>
  </text>
  
  <!-- Tagline técnica industrial -->
  <text x="265" y="244" class="txt-sub">PRECISION MACHINING SUITE</text>
</svg>