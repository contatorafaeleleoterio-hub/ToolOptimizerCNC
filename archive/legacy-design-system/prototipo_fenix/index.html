<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fenix — Protótipo Canônico Interativo (Golden Master)</title>
  <link rel="stylesheet" href="./css/prototipo.css">
</head>
<body>

  <!-- BARRA DE UTILIDADE / HOMOLOGAÇÃO DO PRODUTO (DEMO & TEST CONTROLS) -->
  <header class="demo-toolbar" role="region" aria-label="Barra de Homologação e Cenários da Fase 1">
    <div style="display:flex;align-items:center;gap:8px">
      <strong>FENIX PROTÓTIPO CANÔNICO</strong>
      <span style="opacity:.6">· Fase 1 Golden Master</span>
    </div>

    <div class="demo-scenarios">
      <label for="demo-scenario-select" style="font-size:11px;opacity:.9">Cenário de Teste (Spec Sheet):</label>
      <select id="demo-scenario-select" aria-label="Selecionar Cenário da Specification Sheet">
        <option value="vazio" selected>Estado Inicial Zerado: Painel Vazio (Cenário A)</option>
        <option value="cenario1">Cenário 1: Fresamento Nominal Toroidal (Aço 1045)</option>
        <option value="cenario2">Cenário 2: Furar Broca HSS-Co Modo do Mestre</option>
        <option value="cenario3">Cenário 3: Validação Sem Bloqueio (ae = 12 > D = 10)</option>
        <option value="cenarioRoscar">Cenário Roscar: Macho M8 × 1,25 (Cinemática Travada)</option>
        <option value="cenarioMandrilar">Cenário Mandrilar: Barra Única Ø18 → Ø20</option>
        <option value="erro_digitacao">Erro de Digitação (L = 3000 mm sem travar)</option>
      </select>
    </div>

    <div style="display:flex;align-items:center;gap:12px">
      <div class="demo-viewport-btns">
        <span style="font-size:11px;opacity:.8;margin-right:2px">Viewport:</span>
        <button type="button" class="demo-vbtn active" data-vp="desktop">Desktop</button>
        <button type="button" class="demo-vbtn" data-vp="tablet">Tablet (834px)</button>
        <button type="button" class="demo-vbtn" data-vp="mobile">Celular (390px)</button>
      </div>
      <a class="demo-link-static" href="folhas-estaticas.html" title="Folhas congeladas em 05/09/2026 — registro histórico, não o contrato do painel">Artboards Históricos (.dc.html)</a>
    </div>
  </header>

  <!-- CONTÊINER DO VIEWPORT ADAPTÁVEL -->
  <main id="viewport-container" class="viewport-wrapper">

    <!-- CABEÇALHO Z1 — Identidade, Resumo do Par e Acesso a Configurações -->
    <section class="card z1-card" aria-label="Cabeçalho do Sistema">
      <div class="brand-plate" role="img" aria-label="Marca Fenix">FENIX</div>
      <div class="zid" id="z1-identidade">
        <!-- Renderizado dinamicamente por renderHeaderZ1() -->
      </div>
      <button type="button" class="hbtn" id="btn-nav-configuracoes">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.3 2.4a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L3 11a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1L9.5 21h5l.3-2.4a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6a7 7 0 0 0 .1-1Z"></path></svg>
        Configurações
      </button>
    </section>

    <!-- NAVEGAÇÃO ENTRE AS 4 FAMÍLIAS CANÔNICAS (SEGMENTED CONTROL INDUSTRIAL) -->
    <nav class="nav-bar" id="main-nav-bar" aria-label="Famílias de Usinagem">
      <div class="nav-families" role="tablist" aria-label="Seletor de processo de usinagem">
        <button type="button" class="nav-tab active" data-tab="fresar" role="tab" aria-selected="true" id="tab-fresar">
          <svg class="tab-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18"></path><path d="M9 21V9"></path></svg>
          <span>Fresar</span>
        </button>
        <button type="button" class="nav-tab" data-tab="furar" role="tab" aria-selected="false" id="tab-furar">
          <svg class="tab-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v14"></path><path d="m8 12 4 4 4-4"></path><path d="m10 22 2-2 2 2"></path></svg>
          <span>Furar</span>
        </button>
        <button type="button" class="nav-tab" data-tab="roscar" role="tab" aria-selected="false" id="tab-roscar">
          <svg class="tab-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M6 10h12"></path><path d="M8 14h8"></path><path d="M10 18h4"></path><path d="M12 2v20"></path></svg>
          <span>Roscar</span>
        </button>
        <button type="button" class="nav-tab" data-tab="mandrilar" role="tab" aria-selected="false" id="tab-mandrilar">
          <svg class="tab-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="M12 3v5"></path><path d="M12 16v5"></path></svg>
          <span>Mandrilar</span>
        </button>
      </div>
    </nav>

    <!-- VISTA 1: PAINEL DE CÁLCULO PRINCIPAL (DUAS COLUNAS: CONFIGURAÇÃO × RESULTADOS) -->
    <div id="view-calculo" class="main-layout">

      <!-- COLUNA ESQUERDA: CONFIGURAÇÃO DA MONTAGEM E ENTRADAS -->
      <section class="col-config" id="config-form-container" aria-label="Entradas e Configurações de Usinagem">
        <!-- Renderizado dinamicamente por renderConfigForm() -->
      </section>

      <!-- COLUNA DIREITA: RESULTADOS ACIONÁVEIS, INDICADORES E INSTRUÇÕES -->
      <section class="col-results" id="col-resultados-content" aria-label="Resultados Calculados e Diagnóstico de Corte">
        <!-- Renderizado dinamicamente por renderCalculatedResults() -->
      </section>

    </div>

    <!-- VISTA 2: ÁREA DE CONFIGURAÇÕES (GESTÃO DE MATERIAIS, FERRAMENTAS E MARGEM) -->
    <section id="view-configuracoes" hidden aria-label="Área de Configurações Gerais do Sistema">
      <!-- Renderizado dinamicamente por renderSettingsView() -->
    </section>

  </main>

  <script src="./js/mock-data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
